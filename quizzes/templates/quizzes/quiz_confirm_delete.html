{% extends "base.html" %}

{% block title %}Удаление квиза{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center">
    <h1 class="text-2xl font-bold mb-4">Удалить квиз?</h1>
    <p class="mb-6">Вы уверены, что хотите удалить "{{ quiz.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded">Да, удалить</button>
        <a href="{% url 'quizzes:my_quizzes' %}" class="bg-gray-500 text-white px-4 py-2 rounded">Отмена</a>
    </form>
</div>
{% endblock %}
