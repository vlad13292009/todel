{% extends "base.html" %}
{% block title %}Удаление вопроса | QuizRumble{% endblock %}
{% block content %}
<div class="container mx-auto max-w-lg py-10">
    <div class="bg-white p-6 rounded shadow-md border border-red-300">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Подтверждение удаления</h1>
        <p class="mb-6">Вы уверены, что хотите удалить вопрос <strong>"{{ question.text|truncatechars:20 }}"</strong>? Это действие нельзя отменить.</p>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-4 justify-end">
                <a href="{% url 'quizzes:quiz_edit' quiz.id %}" class="bg-gray-500 text-white px-4 py-2 rounded">Отмена</a>
                <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Да, удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
