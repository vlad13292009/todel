<!DOCTYPE html>
<html lang="ru" class="scrollbar-quiz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizRumble{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7c3aed",
                        neon: "#22d3ee",
                        bgdark: "#050816"
                    }
                }
            },
            plugins: [
                function ({ addUtilities, theme }) {
                    const track = "#0f172a";
                    const thumbStart = theme("colors.neon");
                    const thumbEnd = theme("colors.primary");
                    const corner = theme("colors.bgdark");

                    const scrollbarUtilities = {};
                    ["scrollbar-quiz", "quizrumble-scroll"].forEach((name) => {
                        scrollbarUtilities[`.${name}`] = {
                            "scrollbar-width": "thin",
                            "scrollbar-color": `${thumbEnd} ${track}`,
                        };
                        scrollbarUtilities[`.${name}::-webkit-scrollbar`] = {
                            width: "10px",
                            height: "10px",
                        };
                        scrollbarUtilities[`.${name}::-webkit-scrollbar-track`] = {
                            background: track,
                            "border-radius": "9999px",
                        };
                        scrollbarUtilities[`.${name}::-webkit-scrollbar-thumb`] = {
                            background: `linear-gradient(180deg, ${thumbStart} 0%, ${thumbEnd} 100%)`,
                            "border-radius": "9999px",
                            border: `2px solid ${track}`,
                        };
                        scrollbarUtilities[`.${name}::-webkit-scrollbar-thumb:hover`] = {
                            background: "linear-gradient(180deg, #67e8f9 0%, #a855f7 100%)",
                        };
                        scrollbarUtilities[`.${name}::-webkit-scrollbar-corner`] = {
                            background: corner,
                        };
                    });

                    addUtilities(scrollbarUtilities);
                },
            ],
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="scrollbar-quiz min-h-screen bg-[#050816] bg-[radial-gradient(ellipse_at_top,rgba(34,211,238,0.14),transparent_45%),radial-gradient(ellipse_at_bottom,rgba(124,58,237,0.12),transparent_50%)] text-slate-100 antialiased flex flex-col">

<header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/70 backdrop-blur-xl">
    {% include 'navbar.html' %}
</header>

{% if messages %}
<div class="container mx-auto mt-4 px-6">
    {% for message in messages %}
        <div data-message class="mb-2 flex items-start justify-between gap-4 rounded-2xl border p-4 text-sm shadow-lg
                {% if message.tags == 'success' %}border-emerald-400/60 bg-emerald-500/30 text-emerald-200 shadow-emerald-500/20
                {% elif message.tags == 'error' %}border-red-400/60 bg-red-500/30 text-red-200 shadow-red-500/20
                {% elif message.tags == 'warning' %}border-yellow-300/60 bg-yellow-500/30 text-yellow-200 shadow-yellow-500/20
                {% else %}border-cyan-400/60 bg-cyan-500/30 text-cyan-200 shadow-cyan-500/20{% endif %}">
            <span>{{ message }}</span>
            <button type="button"
                    class="rounded-lg px-2 text-xl leading-none text-white/70 transition hover:bg-white/10 hover:text-white"
                    aria-label="Закрыть сообщение">
                &times;
            </button>
        </div>
    {% endfor %}
</div>
{% endif %}

<main class="container mx-auto flex-grow px-6 py-12">
    {% block content %}{% endblock %}
</main>

{% include 'footer.html' %}

{% block extended_js %}
<script>
    document.querySelectorAll('[data-message]').forEach(el => {
        let dismiss = () => {
            el.style.transition = 'opacity 0.5s ease';
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 500);
        };

        el.querySelector('button').onclick = dismiss;
        setTimeout(dismiss, 5000);
    });
</script>
{% endblock %}
</body>
</html>
