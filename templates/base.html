<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizRumble{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#7c3aed",
                        neon: "#22d3ee",
                        bgdark: "#050816"
                    }
                }
            }
        };
    </script>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-gradient-to-br from-[#050816] via-[#0b1120] to-[#020617] text-gray-200 min-h-screen flex flex-col">

<header x-data="{ mobileMenuOpen: false }" class="border-b border-white/10 backdrop-blur-lg bg-white/5 sticky top-0 z-50">
    {% include 'navbar.html' %}
</header>

{% if messages %}
<div class="container mx-auto px-6 mt-4">
    {% for message in messages %}
    <div x-data="{ show: true }"
         x-show="show"
         x-init="setTimeout(() => show = false, 5000)"
         x-transition
         class="p-4 rounded-lg mb-2 flex justify-between items-center
                {% if message.tags == 'success' %}bg-green-500
                {% elif message.tags == 'error' %}bg-red-500
                {% elif message.tags == 'warning' %}bg-yellow-500
                {% else %}bg-blue-500{% endif %}">
        <span>{{ message }}</span>
        <button @click="show = false" class="text-white hover:opacity-80">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}

<main class="flex-grow container mx-auto px-6 py-12">
    {% block content %}{% endblock %}
</main>

{% include 'footer.html' %}

</body>
</html>
