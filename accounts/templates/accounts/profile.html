{% extends "base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<section class="mx-auto w-full max-w-md">
    <div class="relative overflow-hidden rounded-3xl border border-cyan-400/20 bg-slate-900/80 p-8 shadow-2xl shadow-black/40 backdrop-blur-xl sm:p-10">
        <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-cyan-400/10 via-transparent to-purple-600/10"></div>

        <div class="relative">
            <div class="mb-8 border-b border-cyan-400/20 pb-8 text-center">
                <div class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 text-3xl font-bold text-white shadow-lg shadow-cyan-500/30">
                    {{ user.username|first|upper }}
                </div>
                <h1 class="bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-3xl font-bold text-transparent">
                    Профиль
                </h1>
                <p class="mt-2 text-sm text-slate-400">
                    Личная информация пользователя
                </p>
            </div>

            <div class="divide-y divide-cyan-400/20">
                <div class="flex items-center justify-between gap-4 py-4">
                    <span class="text-sm font-medium text-slate-400">Имя пользователя</span>
                    <span class="max-w-[60%] break-words text-right text-sm font-semibold text-slate-100">
                        {{ user.username }}
                    </span>
                </div>

                <div class="flex items-center justify-between gap-4 py-4">
                    <span class="text-sm font-medium text-slate-400">Email</span>
                    <span class="max-w-[60%] break-words text-right text-sm font-semibold text-slate-100">
                        {{ user.email|default:"—" }}
                    </span>
                </div>

                <div class="flex items-center justify-between gap-4 py-4">
                    <span class="text-sm font-medium text-slate-400">Роль</span>
                    <span class="rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-white">
                        {{ user.role }}
                    </span>
                </div>
            </div>

            <form method="post" action="{% url 'accounts:logout' %}" class="mt-6">
                {% csrf_token %}
                <button type="submit"
                        class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-red-500 to-pink-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-red-500/20 transition hover:-translate-y-0.5 hover:shadow-red-500/40">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Выйти из аккаунта
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
