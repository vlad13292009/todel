{% extends "base.html" %}

{% block title %}Регистрация участника{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-bold mb-6">Регистрация участника</h2>

    {% if form.errors %}
    <div class="bg-red-500 text-white p-4 rounded mb-4">
        <strong>Ошибка:</strong>
        {{ form.errors }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-purple-500 text-white rounded">
            Зарегистрироваться
        </button>
    </form>
    
    <div class="mt-4">
        <p>Уже есть аккаунт?</p>
        <a href="{% url 'accounts:login' %}" class="text-blue-400 hover:underline">
            Войти
        </a>
    </div>
</div>
{% endblock %}
