{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-bold mb-6">Вход в систему</h2>

    {% if form.errors %}
    <div class="bg-red-500 text-white p-4 rounded mb-4">
        <strong>Ошибка:</strong>
        {{ form.errors }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">
            Войти
        </button>
    </form>

    <div class="mt-4">
        <p>Нет аккаунта?</p>
        <a href="{% url 'accounts:register_organizer' %}" class="text-blue-400 hover:underline">
            Зарегистрироваться как организатор
        </a>
        <a href="{% url 'accounts:register_participant' %}" class="text-blue-400 hover:underline">
            Зарегистрироваться как участник
        </a>
    </div>
</div>
{% endblock %}
