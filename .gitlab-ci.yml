image: python:3.11

stages:
  - test
  - lint
  - coverage
  - docs
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install -r requirements.txt
  - pip install pytest pytest-cov sphinx sphinx-rtd-theme pylint

tests:
  stage: test
  script:
    - python manage.py test --noinput
  artifacts:
    when: always
    reports:
      junit: report.xml

pylint:
  stage: lint
  script:
    - pylint --fail-under=5 quizzes/ accounts/ quiz_service/
  artifacts:
    paths:
      - pylint_report.txt

coverage:
  stage: coverage
  script:
    - coverage run manage.py test
    - coverage report
    - coverage xml
  coverage: '/TOTAL.* ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/

docs:
  stage: docs
  script:
    - sphinx-build -b html docs/source docs/build/html
  artifacts:
    paths:
      - docs/build/html
  #only:
    #- main
    #- dev

deploy:
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y -qq sshpass
    - sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH && git pull origin main && source venv/bin/activate && pip install -r requirements.txt && python manage.py migrate && sudo systemctl restart gunicorn"
  #only:
    #- main
  environment:
    name: production
    url: http://$DEPLOY_SERVER
