image: python:3.11

stages:
  - pages

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install sphinx sphinx-rtd-theme

pages:
  stage: pages
  script:
    - mkdir -p docs/source
    - cd docs
    - sphinx-quickstart --sep -p "QuizRumble" -a "Team" -r "1.0" --no-batchfile --quiet
    - echo "html_theme = 'sphinx_rtd_theme'" >> source/conf.py
    - echo "extensions = ['sphinx.ext.autodoc']" >> source/conf.py
    - echo ".. automodule:: quizzes.views\n   :members:" >> source/index.rst
    - make html
    - mv build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
