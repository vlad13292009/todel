image: python:3.11

stages:
  - lint
  - test
  - build
  - deploy
  - pages

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: runner
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  REDIS_URL: redis://redis:6379/1

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - pip install pylint flake8 black isort
    - flake8 . --count --max-line-length=127 --statistics
    - black --check --diff .
    - isort --check-only --diff .
    - pylint quizzes/ accounts/ --exit-zero
  allow_failure: true

test:
  stage: test
  services:
    - postgres:15-alpine
    - redis:7-alpine
  script:
    - pip install pytest pytest-cov pytest-django
    - pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=75
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
  coverage: '/TOTAL.* ([0-9]{1,3}%)/'

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop

deploy:
  stage: deploy
  script:
    - echo "Deploy script available in repository"
    - echo "Run: ssh root@188.127.254.35 'cd /home/site1/app/quizrumble && ./deploy.sh'"
  only:
    - main
  when: manual

pages:
  stage: pages
  script:
    - pip install sphinx sphinx-rtd-theme
    - mkdir -p docs/source
    - cd docs
    - sphinx-quickstart --sep -p "QuizRumble" -a "Team" -r "1.0" --no-batchfile --quiet
    - echo "html_theme = 'sphinx_rtd_theme'" >> source/conf.py
    - echo "extensions = ['sphinx.ext.autodoc']" >> source/conf.py
    - echo ".. automodule:: quizzes.views\n   :members:" >> source/index.rst
    - make html
    - mv build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
